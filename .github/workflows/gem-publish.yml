name: Publish Ruby Gem

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.0'
        
    - name: Run Tests
      run: ruby test/test_sprt.rb
      
    - name: Build Gem
      run: gem build llm_proof.gemspec
      
    - name: Publish to GitHub Packages
      run: |
        mkdir -p ~/.gem
        echo "---" > ~/.gem/credentials
        echo ":github: Bearer ${{ secrets.GITHUB_TOKEN }}" >> ~/.gem/credentials
        chmod 0600 ~/.gem/credentials
        gem push --key github --host https://rubygems.pkg.github.com/saitejabandaru-in *.gem
